[package]
name = "anilili-linux"
version = "1.0.1"
description = "Anilili - Modern Anime Streaming & Library Desktop App for Linux"
authors = ["Anilili Team"]
license = "MIT"
edition = "2021"

[lib]
name = "anilili_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["devtools"] }
tauri-plugin-shell = "2.2"
tauri-plugin-dialog = "2.2"
tauri-plugin-fs = "2.2"
tauri-plugin-deep-link = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
moka = { version = "0.12", features = ["future"] }
regex = "1.10"
once_cell = "1.19"
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2.5"
base64 = "0.22"
libc = "0.2"
dirs = "5.0"
open = "5.3"
tiny_http = "0.12"
flate2 = "1.0"
urlencoding = "2.1"
