[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "anilili-core"
version = "0.1.0"
description = "Native Rust backend for Anilili Linux Desktop"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.7.0",
    "qasync>=0.27.0",
    "python-mpv>=1.0.7",
    "keyring>=25.0.0",
    "Pillow>=10.0.0",
    "httpx>=0.27.0"
]

[tool.maturin]
manifest-path = "anilili-core/Cargo.toml"
module-name = "anilili_core"
python-packages = ["anilili-ui"]
