[package]
name = "anilili-core"
version = "0.1.0"
license = "MIT"
edition = "2021"

[lib]
name = "anilili_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
moka = { version = "0.12", features = ["future"] }
regex = "1.10"
once_cell = "1.19"
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"
tracing = "0.1"
url = "2.5"
base64 = "0.22"
libc = "0.2"

